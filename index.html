    <script>
    (function(){
      function loadInclude(el){
        var src = el.getAttribute('data-include');
        if(!src) return Promise.resolve();
        // when opened via file://, fetch may be blocked; handle errors gracefully
        return fetch(src, { cache: 'no-store' }).then(function(r){ if(!r.ok) throw new Error('Failed to load ' + src); return r.text(); }).then(function(html){
          el.innerHTML = html;
          // Execute inline scripts in the included fragment
          // When moving scripts to the document head we must copy ALL attributes
          // (e.g. data-* for widgets like Giscus) otherwise the widget won't receive its config.
          var scripts = el.querySelectorAll('script');
          scripts.forEach(function(s){
            var ns = document.createElement('script');
            // copy attributes from original script
            for(var i = 0; i < s.attributes.length; i++){
              var a = s.attributes[i];
              try { ns.setAttribute(a.name, a.value); } catch(e) { /* ignore */ }
            }
            if(s.src){ ns.async = false; document.head.appendChild(ns); }
            else { ns.textContent = s.textContent; document.head.appendChild(ns); }
            // remove original to avoid double-run if re-inserted
            s.parentNode && s.parentNode.removeChild(s);
          });
        }).catch(function(err){
          // Include failed; show a minimal fallback so the page isn't blank
          el.innerHTML = '<div class="center small">(Failed to load: ' + src + ')</div>';
        });
      }

      var includes = document.querySelectorAll('[data-include]');
      var promises = Array.from(includes).map(loadInclude);
      Promise.all(promises).catch(function(){ /* ignore include load errors */ });
      
      // Display last updated time
      var lastUpdatedElement = document.getElementById('last-updated');
      if (lastUpdatedElement) {
        var lastModified = new Date(document.lastModified);
        var options = { 
          year: 'numeric', 
          month: 'long', 
          day: 'numeric'
        };
        lastUpdatedElement.textContent = lastModified.toLocaleDateString('en-US', options);
      }
    })();
    </script>
    <script>
    // Mobile nav toggle for small screens
    (function(){
      var toggle = document.getElementById('nav-toggle');
      var nav = document.getElementById('primary-nav');
      if(!toggle || !nav) return;
      function setOpen(open){
        if(open){ nav.classList.add('open'); toggle.setAttribute('aria-expanded','true'); }
        else { nav.classList.remove('open'); toggle.setAttribute('aria-expanded','false'); }
      }
      toggle.addEventListener('click', function(e){ e.stopPropagation(); setOpen(!nav.classList.contains('open')); });
      // Close nav when clicking outside
      document.addEventListener('click', function(e){ if(!nav.contains(e.target) && !toggle.contains(e.target)) setOpen(false); });
    })();
    </script>
    <script>
    // Manual light/dark theme switcher. Preference is saved locally.
    (function(){
      var key = 'preferred-theme';
      var root = document.documentElement;
      var btn = document.getElementById('theme-toggle');
      var text = btn ? btn.querySelector('.theme-text') : null;

      function applyTheme(theme){
        var dark = theme === 'dark';
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        if(btn){
          btn.setAttribute('aria-pressed', String(dark));
          btn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
        }
        if(text) text.textContent = dark ? 'Light' : 'Dark';
      }

      var saved = null;
      try { saved = localStorage.getItem(key); } catch(_) {}
      applyTheme(saved === 'dark' ? 'dark' : 'light');

      if(btn){
        btn.addEventListener('click', function(){
          var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          applyTheme(next);
          try { localStorage.setItem(key, next); } catch(_) {}
        });
      }
    })();
    </script>
    <script>
    // Subtle cursor-driven glow for the research-lab theme.
    (function(){
      var root = document.documentElement;
      var raf = null;
      var x = 50;
      var y = 20;
      function apply(){
        root.style.setProperty('--cursor-x', x + '%');
        root.style.setProperty('--cursor-y', y + '%');
        raf = null;
      }
      document.addEventListener('pointermove', function(e){
        x = Math.round((e.clientX / Math.max(window.innerWidth, 1)) * 100);
        y = Math.round((e.clientY / Math.max(window.innerHeight, 1)) * 100);
        if(!raf) raf = requestAnimationFrame(apply);
      }, { passive: true });
    })();
    </script>
    <script>
    // Lightweight animated neural graph. Pure canvas, no external dependencies.
    (function(){
      if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var canvas = document.getElementById('neural-canvas');
      if(!canvas) return;
      var ctx = canvas.getContext('2d');
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var nodes = [];
      var pointer = { x: -9999, y: -9999, active: false };
      var running = true;
      var frameId = null;

      function cssVar(name, fallback){
        var value = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        return value || fallback;
      }

      function resize(){
        var w = window.innerWidth;
        var h = window.innerHeight;
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        seed(w, h);
      }

      function seed(w, h){
        var count = Math.max(34, Math.min(64, Math.floor((w * h) / 26000)));
        nodes = [];
        for(var i = 0; i < count; i++){
          nodes.push({
            x: Math.random() * w,
            y: Math.random() * h,
            vx: (Math.random() - 0.5) * 0.28,
            vy: (Math.random() - 0.5) * 0.28,
            r: 1 + Math.random() * 1.4,
            phase: Math.random() * Math.PI * 2
          });
        }
      }

      function draw(){
        if(!running) return;
        var w = window.innerWidth;
        var h = window.innerHeight;
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        var brand = cssVar('--brand', dark ? '#6ee7f9' : '#0f5d7a');
        var deep = cssVar('--brand-deep', dark ? '#5eead4' : '#08766f');
        ctx.clearRect(0, 0, w, h);

        for(var i = 0; i < nodes.length; i++){
          var a = nodes[i];
          a.phase += 0.008;
          a.x += a.vx + Math.sin(a.phase) * 0.035;
          a.y += a.vy + Math.cos(a.phase) * 0.035;
          if(a.x < -20) a.x = w + 20;
          if(a.x > w + 20) a.x = -20;
          if(a.y < -20) a.y = h + 20;
          if(a.y > h + 20) a.y = -20;

          if(pointer.active){
            var pdx = pointer.x - a.x;
            var pdy = pointer.y - a.y;
            var pd = Math.sqrt(pdx * pdx + pdy * pdy);
            if(pd < 180 && pd > 1){
              a.x -= (pdx / pd) * 0.08;
              a.y -= (pdy / pd) * 0.08;
            }
          }

          for(var j = i + 1; j < nodes.length; j++){
            var b = nodes[j];
            var dx = a.x - b.x;
            var dy = a.y - b.y;
            var dist = Math.sqrt(dx * dx + dy * dy);
            if(dist < 145){
              var alpha = (1 - dist / 145) * (dark ? 0.18 : 0.13);
              ctx.strokeStyle = brand;
              ctx.globalAlpha = alpha;
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.stroke();
            }
          }

          if(pointer.active){
            var mx = a.x - pointer.x;
            var my = a.y - pointer.y;
            var md = Math.sqrt(mx * mx + my * my);
            if(md < 165){
              ctx.strokeStyle = deep;
              ctx.globalAlpha = (1 - md / 165) * (dark ? 0.28 : 0.18);
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(pointer.x, pointer.y);
              ctx.stroke();
            }
          }
        }

        for(var k = 0; k < nodes.length; k++){
          var n = nodes[k];
          ctx.globalAlpha = dark ? 0.58 : 0.44;
          ctx.fillStyle = k % 3 === 0 ? deep : brand;
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        frameId = requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize);
      document.addEventListener('pointermove', function(e){
        pointer.x = e.clientX;
        pointer.y = e.clientY;
        pointer.active = true;
      }, { passive: true });
      document.addEventListener('pointerleave', function(){ pointer.active = false; });
      document.addEventListener('visibilitychange', function(){
        running = !document.hidden;
        if(running && !frameId) draw();
      });
      resize();
      draw();
    })();
    </script>
   
  </body>
