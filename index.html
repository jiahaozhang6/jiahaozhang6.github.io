    <script>
    (function(){
      function loadInclude(el){
        var src = el.getAttribute('data-include');
        if(!src) return Promise.resolve();
        // when opened via file://, fetch may be blocked; handle errors gracefully
        return fetch(src, { cache: 'no-store' }).then(function(r){ if(!r.ok) throw new Error('Failed to load ' + src); return r.text(); }).then(function(html){
          el.innerHTML = html;
          // Execute inline scripts in the included fragment
          // When moving scripts to the document head we must copy ALL attributes
          // (e.g. data-* for widgets like Giscus) otherwise the widget won't receive its config.
          var scripts = el.querySelectorAll('script');
          scripts.forEach(function(s){
            var ns = document.createElement('script');
            // copy attributes from original script
            for(var i = 0; i < s.attributes.length; i++){
              var a = s.attributes[i];
              try { ns.setAttribute(a.name, a.value); } catch(e) { /* ignore */ }
            }
            if(s.src){ ns.async = false; document.head.appendChild(ns); }
            else { ns.textContent = s.textContent; document.head.appendChild(ns); }
            // remove original to avoid double-run if re-inserted
            s.parentNode && s.parentNode.removeChild(s);
          });
        }).catch(function(err){
          // Include failed; show a minimal fallback so the page isn't blank
          el.innerHTML = '<div class="center small">(Failed to load: ' + src + ')</div>';
        });
      }

      var includes = document.querySelectorAll('[data-include]');
      var promises = Array.from(includes).map(loadInclude);
      Promise.all(promises).catch(function(){ /* ignore include load errors */ });
      
      // Display last updated time
      var lastUpdatedElement = document.getElementById('last-updated');
      if (lastUpdatedElement) {
        var lastModified = new Date(document.lastModified);
        var options = { 
          year: 'numeric', 
          month: 'long', 
          day: 'numeric'
        };
        lastUpdatedElement.textContent = lastModified.toLocaleDateString('en-US', options);
      }
    })();
    </script>
    <script>
    // Mobile nav toggle for small screens
    (function(){
      var toggle = document.getElementById('nav-toggle');
      var nav = document.getElementById('primary-nav');
      if(!toggle || !nav) return;
      function setOpen(open){
        if(open){ nav.classList.add('open'); toggle.setAttribute('aria-expanded','true'); }
        else { nav.classList.remove('open'); toggle.setAttribute('aria-expanded','false'); }
      }
      toggle.addEventListener('click', function(e){ e.stopPropagation(); setOpen(!nav.classList.contains('open')); });
      nav.addEventListener('click', function(e){ if(e.target.closest('a')) setOpen(false); });
      document.addEventListener('keydown', function(e){ if(e.key === 'Escape') setOpen(false); });
      // Close nav when clicking outside
      document.addEventListener('click', function(e){ if(!nav.contains(e.target) && !toggle.contains(e.target)) setOpen(false); });
    })();
    </script>
    <script>
    // Manual light/dark theme switcher. Preference is saved locally.
    (function(){
      var key = 'preferred-theme';
      var root = document.documentElement;
      var btn = document.getElementById('theme-toggle');
      var text = btn ? btn.querySelector('.theme-text') : null;

      function applyTheme(theme){
        var dark = theme === 'dark';
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        if(btn){
          btn.setAttribute('aria-pressed', String(dark));
          btn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
        }
        if(text) text.textContent = dark ? 'Light' : 'Dark';
      }

      var saved = null;
      try { saved = localStorage.getItem(key); } catch(_) {}
      applyTheme(saved === 'dark' ? 'dark' : 'light');

      if(btn){
        btn.addEventListener('click', function(){
          var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          applyTheme(next);
          try { localStorage.setItem(key, next); } catch(_) {}
        });
      }
    })();
    </script>
    <script>
    // Subtle cursor-driven glow for the research-lab theme.
    (function(){
      var root = document.documentElement;
      var raf = null;
      var x = 50;
      var y = 20;
      function apply(){
        root.style.setProperty('--cursor-x', x + '%');
        root.style.setProperty('--cursor-y', y + '%');
        raf = null;
      }
      document.addEventListener('pointermove', function(e){
        x = Math.round((e.clientX / Math.max(window.innerWidth, 1)) * 100);
        y = Math.round((e.clientY / Math.max(window.innerHeight, 1)) * 100);
        if(!raf) raf = requestAnimationFrame(apply);
      }, { passive: true });
    })();
    </script>
    <script>
    // Animated Shiba desktop pet with atlas-driven states, pointer tracking, dragging, and gestures.
    (function(){
      var pet = document.getElementById('shiba-pet');
      if(!pet) return;
      var button = pet.querySelector('.shiba-pet__button');
      var bubble = pet.querySelector('.shiba-pet__bubble');
      var sprite = pet.querySelector('.shiba-pet__sprite');
      if(!button || !bubble || !sprite) return;

      var messages = ['Woof!', 'Hi!', 'Good luck!', 'Keep exploring!', 'Have a nice day!'];
      var idleActions = [
        { className: 'is-happy', duration: 950 },
        { className: 'is-pawing', duration: 1200 },
        { className: 'is-listening', duration: 1350 },
        { className: 'is-spinning', duration: 1150 },
        { className: 'is-sleeping', duration: 2200 },
        { className: 'is-sniffing', duration: 1450 }
      ];
      var messageIndex = -1;
      var hideTimer = null;
      var actionTimer = null;
      var clickTimer = null;
      var holdTimer = null;
      var idleTimer = null;
      var raf = null;
      var pointerX = 0;
      var pointerY = 0;
      var activePointer = null;
      var startX = 0;
      var startY = 0;
      var dragging = false;
      var longPressed = false;
      var ignoreClick = false;
      var spriteTimer = null;
      var spriteMode = '';
      var lastLookFrame = -1;
      var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var spriteAnimations = {
        idle: { row: 0, frames: 7, interval: 185 },
        runningRight: { row: 1, frames: 8, interval: 92 },
        runningLeft: { row: 2, frames: 8, interval: 92 },
        waving: { row: 3, frames: 4, interval: 145 },
        jumping: { row: 4, frames: 5, interval: 115 },
        failed: { row: 5, frames: 8, interval: 190 },
        waiting: { row: 6, frames: 6, interval: 175 },
        running: { row: 7, frames: 6, interval: 105 },
        review: { row: 8, frames: 6, interval: 170 }
      };
      var spriteForAction = {
        'is-happy': 'jumping',
        'is-pawing': 'waving',
        'is-listening': 'review',
        'is-spinning': 'running',
        'is-sleeping': 'failed',
        'is-sniffing': 'waiting'
      };

      function setSpriteFrame(row, column){
        var x = (column / 7) * 100;
        var y = (row / 10) * 100;
        sprite.style.backgroundPosition = x.toFixed(4) + '% ' + y.toFixed(4) + '%';
      }

      function playSprite(name){
        clearInterval(spriteTimer);
        spriteTimer = null;
        spriteMode = name;
        lastLookFrame = -1;
        var config = spriteAnimations[name] || spriteAnimations.idle;
        var frame = 0;
        setSpriteFrame(config.row, frame);
        if(reducedMotion) return;
        spriteTimer = setInterval(function(){
          frame = (frame + 1) % config.frames;
          setSpriteFrame(config.row, frame);
        }, config.interval);
      }

      function hasActiveAction(){
        return pet.classList.contains('is-happy') ||
          pet.classList.contains('is-pawing') ||
          pet.classList.contains('is-listening') ||
          pet.classList.contains('is-spinning') ||
          pet.classList.contains('is-sleeping') ||
          pet.classList.contains('is-sniffing') ||
          pet.classList.contains('is-dragging');
      }

      function clearActionClasses(){
        pet.classList.remove('is-happy', 'is-pawing', 'is-listening', 'is-spinning', 'is-sleeping', 'is-sniffing');
      }

      function speak(message, duration){
        bubble.textContent = message;
        pet.classList.add('is-speaking');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(function(){ pet.classList.remove('is-speaking'); }, duration || 1200);
      }

      function react(className, message, duration){
        clearActionClasses();
        void pet.offsetWidth;
        pet.classList.add(className);
        playSprite(spriteForAction[className] || 'idle');
        if(message) speak(message, duration);
        clearTimeout(actionTimer);
        actionTimer = setTimeout(function(){
          pet.classList.remove(className);
          playSprite('idle');
        }, duration || 1200);
      }

      function clamp(value, min, max){
        return Math.max(min, Math.min(max, value));
      }

      function setPetPosition(clientX, clientY, save){
        var rect = pet.getBoundingClientRect();
        var right = clamp(window.innerWidth - clientX - rect.width / 2, 4, Math.max(4, window.innerWidth - rect.width - 4));
        var bottom = clamp(window.innerHeight - clientY - rect.height / 2, 4, Math.max(4, window.innerHeight - rect.height - 4));
        pet.style.right = right + 'px';
        pet.style.bottom = bottom + 'px';
        if(save){
          try { localStorage.setItem('shiba-pet-position', JSON.stringify({ right: right, bottom: bottom })); } catch(_) {}
        }
      }

      try {
        var savedPosition = JSON.parse(localStorage.getItem('shiba-pet-position') || 'null');
        if(savedPosition && Number.isFinite(savedPosition.right) && Number.isFinite(savedPosition.bottom)){
          var petRect = pet.getBoundingClientRect();
          pet.style.right = clamp(savedPosition.right, 4, Math.max(4, window.innerWidth - petRect.width - 4)) + 'px';
          pet.style.bottom = clamp(savedPosition.bottom, 4, Math.max(4, window.innerHeight - petRect.height - 4)) + 'px';
        }
      } catch(_) {}

      function updateLook(){
        var rect = button.getBoundingClientRect();
        var centerX = rect.left + rect.width * 0.53;
        var centerY = rect.top + rect.height * 0.43;
        var dx = Math.max(-2.4, Math.min(2.4, (pointerX - centerX) / 90));
        var dy = Math.max(-1.8, Math.min(1.8, (pointerY - centerY) / 90));
        pet.style.setProperty('--shiba-look-x', dx.toFixed(2) + 'px');
        pet.style.setProperty('--shiba-look-y', dy.toFixed(2) + 'px');
        pet.style.setProperty('--shiba-look-rotate', (dx * 0.55).toFixed(2) + 'deg');
        var distance = Math.hypot(pointerX - centerX, pointerY - centerY);
        var curious = activePointer === null && distance < 210;
        pet.classList.toggle('is-curious', curious);
        if(curious && !hasActiveAction()){
          var angle = Math.atan2(pointerY - centerY, pointerX - centerX);
          var lookIndex = Math.round(((angle + Math.PI) / (Math.PI * 2)) * 15) % 16;
          if(lookIndex !== lastLookFrame){
            clearInterval(spriteTimer);
            spriteTimer = null;
            spriteMode = 'look';
            lastLookFrame = lookIndex;
            setSpriteFrame(lookIndex < 8 ? 9 : 10, lookIndex % 8);
          }
        }else if(!hasActiveAction() && spriteMode === 'look'){
          playSprite('idle');
        }
        raf = null;
      }

      document.addEventListener('pointermove', function(event){
        pointerX = event.clientX;
        pointerY = event.clientY;
        if(!raf) raf = requestAnimationFrame(updateLook);
      }, { passive: true });

      document.addEventListener('pointerleave', function(){
        pet.style.setProperty('--shiba-look-x', '0px');
        pet.style.setProperty('--shiba-look-y', '0px');
        pet.style.setProperty('--shiba-look-rotate', '0deg');
        pet.classList.remove('is-curious');
        if(!hasActiveAction()) playSprite('idle');
      });

      button.addEventListener('pointerdown', function(event){
        if(event.button !== undefined && event.button !== 0) return;
        activePointer = event.pointerId;
        startX = event.clientX;
        startY = event.clientY;
        dragging = false;
        longPressed = false;
        pet.classList.add('is-held');
        try { button.setPointerCapture(event.pointerId); } catch(_) {}
        clearTimeout(holdTimer);
        holdTimer = setTimeout(function(){
          if(!dragging){
            longPressed = true;
            ignoreClick = true;
            clearActionClasses();
            clearTimeout(actionTimer);
            playSprite('idle');
            speak('Easy…', 1300);
          }
        }, 650);
      });

      button.addEventListener('pointermove', function(event){
        if(activePointer !== event.pointerId) return;
        if(Math.hypot(event.clientX - startX, event.clientY - startY) > 6){
          if(!dragging) playSprite(event.clientX >= startX ? 'runningRight' : 'runningLeft');
          dragging = true;
          clearTimeout(holdTimer);
          pet.classList.add('is-dragging');
          setPetPosition(event.clientX, event.clientY, false);
        }
      });

      function finishPointer(event){
        if(activePointer !== event.pointerId) return;
        clearTimeout(holdTimer);
        pet.classList.remove('is-held', 'is-dragging');
        if(dragging){
          setPetPosition(event.clientX, event.clientY, true);
          ignoreClick = true;
          speak('New spot!', 900);
          playSprite('idle');
        }
        activePointer = null;
        dragging = false;
      }

      button.addEventListener('pointerup', finishPointer);
      button.addEventListener('pointercancel', finishPointer);

      button.addEventListener('click', function(){
        if(ignoreClick || longPressed){
          ignoreClick = false;
          longPressed = false;
          return;
        }
        clearTimeout(clickTimer);
        clickTimer = setTimeout(function(){
          clearActionClasses();
          clearTimeout(actionTimer);
          playSprite('idle');
          messageIndex = (messageIndex + 1) % messages.length;
          speak(messages[messageIndex], 1500);
        }, 190);
      });

      button.addEventListener('dblclick', function(event){
        event.preventDefault();
        clearTimeout(clickTimer);
        clearActionClasses();
        clearTimeout(actionTimer);
        playSprite('idle');
        messageIndex = (messageIndex + 1) % messages.length;
        speak(messages[messageIndex], 1500);
      });

      function scheduleIdle(){
        clearTimeout(idleTimer);
        idleTimer = setTimeout(function(){
          if(!document.hidden && activePointer === null && !pet.classList.contains('is-speaking')){
            var action = idleActions[Math.floor(Math.random() * idleActions.length)];
            react(action.className, null, action.duration);
          }
          scheduleIdle();
        }, 6500 + Math.random() * 6000);
      }

      playSprite('idle');
      scheduleIdle();
    })();
    </script>
    <script>
    // Lightweight animated neural graph. Pure canvas, no external dependencies.
    (function(){
      if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var canvas = document.getElementById('neural-canvas');
      if(!canvas) return;
      var ctx = canvas.getContext('2d');
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var nodes = [];
      var pointer = { x: -9999, y: -9999, active: false };
      var running = true;
      var frameId = null;

      function cssVar(name, fallback){
        var value = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        return value || fallback;
      }

      function resize(){
        var w = window.innerWidth;
        var h = window.innerHeight;
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        seed(w, h);
      }

      function seed(w, h){
        var count = Math.max(34, Math.min(64, Math.floor((w * h) / 26000)));
        nodes = [];
        for(var i = 0; i < count; i++){
          nodes.push({
            x: Math.random() * w,
            y: Math.random() * h,
            vx: (Math.random() - 0.5) * 0.28,
            vy: (Math.random() - 0.5) * 0.28,
            r: 1 + Math.random() * 1.4,
            phase: Math.random() * Math.PI * 2
          });
        }
      }

      function draw(){
        if(!running) return;
        var w = window.innerWidth;
        var h = window.innerHeight;
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        var brand = cssVar('--brand', dark ? '#6ee7f9' : '#0f5d7a');
        var deep = cssVar('--brand-deep', dark ? '#5eead4' : '#08766f');
        ctx.clearRect(0, 0, w, h);

        for(var i = 0; i < nodes.length; i++){
          var a = nodes[i];
          a.phase += 0.008;
          a.x += a.vx + Math.sin(a.phase) * 0.035;
          a.y += a.vy + Math.cos(a.phase) * 0.035;
          if(a.x < -20) a.x = w + 20;
          if(a.x > w + 20) a.x = -20;
          if(a.y < -20) a.y = h + 20;
          if(a.y > h + 20) a.y = -20;

          if(pointer.active){
            var pdx = pointer.x - a.x;
            var pdy = pointer.y - a.y;
            var pd = Math.sqrt(pdx * pdx + pdy * pdy);
            if(pd < 180 && pd > 1){
              a.x -= (pdx / pd) * 0.08;
              a.y -= (pdy / pd) * 0.08;
            }
          }

          for(var j = i + 1; j < nodes.length; j++){
            var b = nodes[j];
            var dx = a.x - b.x;
            var dy = a.y - b.y;
            var dist = Math.sqrt(dx * dx + dy * dy);
            if(dist < 145){
              var alpha = (1 - dist / 145) * (dark ? 0.18 : 0.13);
              ctx.strokeStyle = brand;
              ctx.globalAlpha = alpha;
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.stroke();
            }
          }

          if(pointer.active){
            var mx = a.x - pointer.x;
            var my = a.y - pointer.y;
            var md = Math.sqrt(mx * mx + my * my);
            if(md < 165){
              ctx.strokeStyle = deep;
              ctx.globalAlpha = (1 - md / 165) * (dark ? 0.28 : 0.18);
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(pointer.x, pointer.y);
              ctx.stroke();
            }
          }
        }

        for(var k = 0; k < nodes.length; k++){
          var n = nodes[k];
          ctx.globalAlpha = dark ? 0.58 : 0.44;
          ctx.fillStyle = k % 3 === 0 ? deep : brand;
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        frameId = requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize);
      document.addEventListener('pointermove', function(e){
        pointer.x = e.clientX;
        pointer.y = e.clientY;
        pointer.active = true;
      }, { passive: true });
      document.addEventListener('pointerleave', function(){ pointer.active = false; });
      document.addEventListener('visibilitychange', function(){
        running = !document.hidden;
        if(running && !frameId) draw();
      });
      resize();
      draw();
    })();
    </script>
