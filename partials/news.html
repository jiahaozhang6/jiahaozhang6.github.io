<aside class="news-column" id="news-column" aria-label="News">
  <header class="news-header">
    <div class="news-title-wrap">
      <h3 class="news-heading">News</h3>
      <div id="news-count" class="news-count" aria-hidden="true">—</div>
    </div>
    <div class="news-controls">
      <input id="news-search" class="news-search" type="search" placeholder="Search news" aria-label="Search news">
      <button class="news-toggle-btn" id="news-toggle" aria-controls="news-column" aria-expanded="false" title="Hide/Show News">
        <svg class="arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M8 5l8 7-8 7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="btn-label">Show</span>
      </button>
    </div>
  </header>

  <div id="news-list" class="news-list news-grid" role="region" aria-live="polite">
    <div class="news-loading">Loading news…</div>
  </div>

  <footer class="news-footer small">
    <div class="center">More updates will appear here.</div>
  </footer>
</aside>

<!-- Floating show button (visible when news is collapsed) -->
<button id="news-show" class="news-show-button" aria-controls="news-column" aria-hidden="false" aria-expanded="true" title="Hide News">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M16 5l-8 7 8 7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span>Hide News</span>
</button>

<!-- backdrop removed -->

<script>
(function(){
  var newsHost = document.getElementById('news');
  var btn = document.getElementById('news-toggle');
  var newsCol = document.getElementById('news-column');
  var showBtn = document.getElementById('news-show');
  var body = document.body;
  var listEl = document.getElementById('news-list');
  var searchInput = document.getElementById('news-search');
  var countEl = document.getElementById('news-count');
  var btnLabel = btn ? btn.querySelector('.btn-label') : null;
  var loadedItems = [];
  var storageKey = 'news-panel-collapsed';
  if(!btn || !newsCol || !listEl) return;

  // Portal the news panel and side button to body so floating layout is isolated.
  if(newsCol && newsCol.parentNode !== document.body){
    document.body.appendChild(newsCol);
  }
  if(showBtn && showBtn.parentNode !== document.body){
    document.body.appendChild(showBtn);
  }
  if(newsHost){
    newsHost.style.display = 'none';
  }

  function setState(collapsed){
    body.classList.toggle('news-panel-collapsed', !!collapsed);
    if(collapsed){
      newsCol.classList.add('collapsed');
      btn.setAttribute('aria-expanded','false');
      if(btnLabel) btnLabel.textContent = 'Show';
    } else {
      newsCol.classList.remove('collapsed');
      btn.setAttribute('aria-expanded','true');
      if(btnLabel) btnLabel.textContent = 'Hide';
    }
    if(showBtn){
      var sideLabel = showBtn.querySelector('span');
      showBtn.setAttribute('aria-hidden', 'false');
      showBtn.setAttribute('aria-expanded', String(!collapsed));
      showBtn.setAttribute('title', collapsed ? 'Show News' : 'Hide News');
      if(sideLabel) sideLabel.textContent = collapsed ? 'Show News' : 'Hide News';
    }
    try { localStorage.setItem(storageKey, collapsed ? '1' : '0'); } catch(_) {}
  }
  btn.addEventListener('click', function(){ setState(!newsCol.classList.contains('collapsed')); });
  if(showBtn){ showBtn.addEventListener('click', function(){ setState(!newsCol.classList.contains('collapsed')); }); }
  // backdrop removed: no overlay click handler
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && !newsCol.classList.contains('collapsed')) setState(true); });
  // Restore previous preference; default is open.
  try {
    setState(localStorage.getItem(storageKey) === '1');
  } catch(_) {
    setState(false);
  }

  function escapeHtml(text){
    return String(text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function parseDateValue(v){
    var t = Date.parse(v || '');
    return isNaN(t) ? 0 : t;
  }

  function renderNews(items){
    if(!items || !items.length){ listEl.innerHTML = '<div class="news-empty">No news yet.</div>'; return; }
    // render sorted copy so original data order remains untouched
    var sortedItems = items.slice().sort(function(a,b){ return parseDateValue(b.date) - parseDateValue(a.date); });
    var html = sortedItems.map(function(it){
      var title = escapeHtml(it.title || 'Untitled');
      var date = escapeHtml(it.date || '');
      var summary = it.summary ? ('<div class="news-summary">' + escapeHtml(it.summary) + '</div>') : '';
      var tags = Array.isArray(it.tags) && it.tags.length ? ('<div class="news-tags">' + it.tags.map(function(t){ return '<span class="tag">' + escapeHtml(t) + '</span>'; }).join(' ') + '</div>') : '';
      var url = (typeof it.url === 'string') ? it.url.trim() : '';
      var titleHtml = '<span class="news-title">' + title + '</span>';
      if(url && url !== '#'){
        titleHtml = '<a class="news-title" href="' + escapeHtml(url) + '" target="_blank" rel="noopener">' + title + '</a>';
      }
      return '<article class="news-item">\n' +
             '  <div class="news-date">' + date + '</div>\n' +
             '  ' + titleHtml + '\n' +
             summary + '\n' + tags + '\n' +
             '</article>';
    }).join('\n');
    listEl.innerHTML = html;
  }

  // Filter/search support
  function filterNews(query, items){
    if(!query) return items;
    query = query.toLowerCase();
    return items.filter(function(it){
      var title = (it.title || '').toLowerCase();
      var summary = (it.summary || '').toLowerCase();
      var tags = Array.isArray(it.tags) ? it.tags.join(' ').toLowerCase() : '';
      return title.indexOf(query) !== -1 || summary.indexOf(query) !== -1 || tags.indexOf(query) !== -1;
    });
  }

  // Re-render with optional search value
  function renderWithSearch(items){
    var q = (searchInput && searchInput.value) ? searchInput.value.trim() : '';
    var filtered = filterNews(q, items);
    renderNews(filtered);
    if(countEl) countEl.textContent = filtered.length + ' item' + (filtered.length === 1 ? '' : 's');
  }

  function loadNews(){
    var src = 'data/news.json';
    fetch(src).then(function(r){ if(!r.ok) throw new Error('Failed to load ' + src); return r.json(); }).then(function(json){
      loadedItems = Array.isArray(json) ? json : [];
      renderWithSearch(loadedItems);
    }).catch(function(err){
      if(countEl) countEl.textContent = '0 items';
      // News load failed; show fallback while keeping the panel usable.
      listEl.innerHTML = '<div class="news-error">(Failed to load news. Run this page through the local server.)</div>';
    });
  }

  if(searchInput){ searchInput.addEventListener('input', function(){ renderWithSearch(loadedItems); }); }
  // Attempt to load news; when opened via file:// fetch may be blocked by browser.
  loadNews();

})();
</script>
