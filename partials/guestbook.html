<section class="guestbook" aria-label="Guestbook">
  <h2>留言板</h2>
  <p class="guestbook-note">欢迎留下想说的话 — 谢谢你的到访。</p>

  <div id="guestbook-list" class="guestbook-list">
    <div class="guestbook-loading">加载留言…</div>
  </div>
  
  <div class="guestbook-controls">
    <div class="guestbook-actions">
      <button id="guestbook-local-add" class="button button-ghost">本地留言</button>
    </div>
    <div class="guestbook-toggle">
      <label><input type="checkbox" id="toggle-history"> 显示历史留言</label>
    </div>
  </div>

  <div id="guestbook-history" style="display:none; margin-top:12px">
    <div style="display:flex; gap:8px; align-items:center; margin-bottom:8px">
      <input id="gb-search" placeholder="搜索留言或姓名" style="flex:1;padding:8px;border-radius:6px;border:1px solid #ddd">
      <div id="gb-pagination" style="display:flex;gap:6px;align-items:center"></div>
    </div>
    <div id="guestbook-history-list" class="guestbook-list"></div>
  </div>

  <!-- Giscus (GitHub Discussions) comment widget: recommended for GitHub Pages -->
  <div class="guestbook-discuss">
    <h3>线上留言（Giscus）</h3>
    <p class="guestbook-note">已启用 Giscus（GitHub Discussions）以便保存留言和管理讨论。若需更改配置，请访问 <a href="https://giscus.app" target="_blank">giscus.app</a>。</p>

    <!--
      To enable Giscus, replace the placeholder values below with the attributes
      generated by https://giscus.app. Example attributes to fill:
      data-repo="OWNER/REPO" data-repo-id="REPO_ID" data-category="Discussions" data-category-id="CATEGORY_ID"
    -->
    <div id="giscus-container">
            <script src="https://giscus.app/client.js"
              data-repo="jiahaozhang6/jiahaozhang6.github.io"
              data-repo-id="R_kgDOQSlo9w"
              data-category="Announcements"
              data-category-id="DIC_kwDOQSlo984C1Lbj"
              data-mapping="specific"
              data-term="2"
              data-strict="0"
              data-reactions-enabled="1"
              data-emit-metadata="0"
              data-input-position="bottom"
              data-theme="light"
              data-lang="zh-CN"
              crossorigin="anonymous"
              async>
            </script>
    </div>

    
  </div>

  <script>
  (function(){
    var listEl = document.getElementById('guestbook-list');
    function formatDate(d){
      try{ return new Date(d).toLocaleDateString(); }catch(e){ return d; }
    }

    function avatarInitial(name){ return (name && name[0]) ? name[0].toUpperCase() : '?'; }

    function render(items, target){
      target = target || listEl;
      if(!items || !items.length){ target.innerHTML = '<div class="guestbook-empty">还没有留言。</div>'; return; }
      items.sort(function(a,b){ return new Date(b.date) - new Date(a.date); });
      var html = items.map(function(it){
        var name = it.name ? ('<div class="gb-name">' + it.name + '</div>') : '';
        var date = it.date ? ('<div class="gb-date">' + formatDate(it.date) + '</div>') : '';
        var msg = it.message ? ('<div class="gb-message">' + it.message + '</div>') : '';
        var tags = it.tags && it.tags.length ? ('<div class="gb-tags">' + it.tags.map(function(t){ return '<span class="tag">' + t + '</span>'; }).join(' ') + '</div>') : '';
        var avatar = '<div class="gb-avatar">' + avatarInitial(it.name) + '</div>';
        return '<article class="gb-item">' + avatar + '<div class="gb-body">' + name + date + msg + tags + '</div></article>';
      }).join('\n');
      target.innerHTML = html;
    }

    var staticEntries = [];
    function load(){
      fetch('data/guestbook.json').then(function(r){ if(!r.ok) throw new Error('no file'); return r.json(); }).then(function(json){ staticEntries = json || []; render(staticEntries); }).catch(function(){ listEl.innerHTML = '<div class="guestbook-empty">留言数据不可用。若在本地预览，请使用提供的管理脚本或 HTTP 服务器。</div>'; });
    }

    document.getElementById('guestbook-local-add').addEventListener('click', function(){
      var name = prompt('你的名字 (将仅保存在本地)：');
      if(!name) return;
      var message = prompt('留言内容：');
      if(!message) return;
      var now = new Date().toISOString().slice(0,10);
      var saved = JSON.parse(localStorage.getItem('guestbook-local')||'[]');
      saved.push({ name: name, date: now, message: message });
      localStorage.setItem('guestbook-local', JSON.stringify(saved));
      // render combined view
      render(saved.concat(staticEntries));
    });

    // show stored local entries alongside remote ones
    load();
    var local = JSON.parse(localStorage.getItem('guestbook-local')||'[]');
    if(local && local.length){ render(local.concat(staticEntries)); }

    // History toggle
    var toggle = document.getElementById('toggle-history');
    var historyWrap = document.getElementById('guestbook-history');
    var historyList = document.getElementById('guestbook-history-list');
    var searchInput = document.getElementById('gb-search');
    var pagination = document.getElementById('gb-pagination');
    var pageSize = 5, currentPage = 1;

    function paginate(items, page){
      var start = (page-1)*pageSize; return items.slice(start, start+pageSize);
    }

    function renderHistory(filtered){
      render(filtered, historyList);
      // pagination
      var total = Math.max(0, filtered.length);
      var pages = Math.max(1, Math.ceil(total/pageSize));
      pagination.innerHTML = '';
      var prev = document.createElement('button'); prev.textContent = '‹'; prev.disabled = currentPage===1; prev.addEventListener('click', function(){ if(currentPage>1){ currentPage--; updateHistory(); }});
      var next = document.createElement('button'); next.textContent = '›'; next.disabled = currentPage===pages; next.addEventListener('click', function(){ if(currentPage<pages){ currentPage++; updateHistory(); }});
      var label = document.createElement('span'); label.textContent = currentPage + ' / ' + pages;
      pagination.appendChild(prev); pagination.appendChild(label); pagination.appendChild(next);
    }

    function updateHistory(){
      var q = (searchInput && searchInput.value || '').toLowerCase();
      var filtered = staticEntries.filter(function(it){ return !q || (it.message && it.message.toLowerCase().indexOf(q)!==-1) || (it.name && it.name.toLowerCase().indexOf(q)!==-1); });
      var pages = Math.max(1, Math.ceil(filtered.length/pageSize));
      if(currentPage>pages) currentPage = pages;
      var pageItems = paginate(filtered, currentPage);
      renderHistory(filtered);
      // render actual page items in history list
      render(pageItems, historyList);
    }

    if(toggle){ toggle.addEventListener('change', function(){ historyWrap.style.display = toggle.checked ? 'block' : 'none'; if(toggle.checked) { currentPage = 1; updateHistory(); } }); }
    if(searchInput){ searchInput.addEventListener('input', function(){ currentPage = 1; updateHistory(); }); }
  })();
  </script>
</section>
