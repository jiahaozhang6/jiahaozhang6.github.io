<section class="guestbook" aria-label="Guestbook">
  <h2>留言板</h2>
  <p class="guestbook-note">欢迎留言。站点为静态托管；管理者可以通过后台页面添加永久条目。</p>

  <div id="guestbook-list" class="guestbook-list">
    <div class="guestbook-loading">加载留言…</div>
  </div>

  <div class="guestbook-actions">
    <a href="admin/guestbook_admin.html" class="button">管理留言（Admin）</a>
    <button id="guestbook-local-add" class="button button-ghost">临时本地留言</button>
  </div>

  <!-- Giscus (GitHub Discussions) comment widget: recommended for GitHub Pages -->
  <div class="guestbook-discuss">
    <h3>讨论与留言（建议）</h3>
    <p class="guestbook-note">使用 Giscus 将留言保存为 GitHub Discussions，UI 美观且在仓库中管理。若要启用，请按下方说明配置（或访问 <a href="https://giscus.app" target="_blank">giscus.app</a> 生成配置）。</p>

    <!--
      To enable Giscus, replace the placeholder values below with the attributes
      generated by https://giscus.app. Example attributes to fill:
      data-repo="OWNER/REPO" data-repo-id="REPO_ID" data-category="Discussions" data-category-id="CATEGORY_ID"
    -->
    <div id="giscus-container">
      <div class="guestbook-note">Giscus 未配置 — 请在 <code>partials/guestbook.html</code> 中填入你的仓库信息以启用。</div>
    </div>

    <!-- Example embed (commented out). Uncomment & fill values to enable. -->
    <!--
    <div id="giscus-container">
      <script src="https://giscus.app/client.js"
        data-repo="OWNER/REPO"
        data-repo-id="REPO_ID"
        data-category="General"
        data-category-id="CATEGORY_ID"
        data-mapping="pathname"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="light"
        crossorigin="anonymous"
        async>
      </script>
    </div>
    -->
  </div>

  <script>
  (function(){
    var listEl = document.getElementById('guestbook-list');
    function render(items){
      if(!items || !items.length){ listEl.innerHTML = '<div class="guestbook-empty">还没有留言。</div>'; return; }
      items.sort(function(a,b){ return new Date(b.date) - new Date(a.date); });
      var html = items.map(function(it){
        var name = it.name ? ('<div class="gb-name">' + it.name + '</div>') : '';
        var date = it.date ? ('<div class="gb-date">' + it.date + '</div>') : '';
        var msg = it.message ? ('<div class="gb-message">' + it.message + '</div>') : '';
        var tags = it.tags && it.tags.length ? ('<div class="gb-tags">' + it.tags.map(function(t){ return '<span class="tag">' + t + '</span>'; }).join(' ') + '</div>') : '';
        return '<article class="gb-item">' + name + date + msg + tags + '</article>';
      }).join('\n');
      listEl.innerHTML = html;
    }

    function load(){
      fetch('data/guestbook.json').then(function(r){ if(!r.ok) throw new Error('no file'); return r.json(); }).then(function(json){ render(json); }).catch(function(){ listEl.innerHTML = '<div class="guestbook-empty">留言数据不可用。若在本地预览，请使用提供的管理脚本或 HTTP 服务器。</div>'; });
    }

    document.getElementById('guestbook-local-add').addEventListener('click', function(){
      var name = prompt('你的名字 (将仅保存在本地)：');
      if(!name) return;
      var message = prompt('留言内容：');
      if(!message) return;
      var now = new Date().toISOString().slice(0,10);
      var saved = JSON.parse(localStorage.getItem('guestbook-local')||'[]');
      saved.push({ name: name, date: now, message: message });
      localStorage.setItem('guestbook-local', JSON.stringify(saved));
      // render combined view
      fetch('data/guestbook.json').then(function(r){ if(!r.ok) throw new Error('no'); return r.json(); }).then(function(json){ render(json.concat(saved)); }).catch(function(){ render(saved); });
    });

    // show stored local entries alongside remote ones
    load();
    var local = JSON.parse(localStorage.getItem('guestbook-local')||'[]');
    if(local && local.length){ fetch('data/guestbook.json').then(function(r){ if(!r.ok) throw new Error('no'); return r.json(); }).then(function(json){ render(json.concat(local)); }).catch(function(){ render(local); }); }
  })();
  </script>
</section>
